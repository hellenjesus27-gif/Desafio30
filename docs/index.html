<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
const MS_DAY = 86400000;
function toISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}
function todayISO(now = new Date()) {
    return toISO(now);
}
/** Número de dias (UTC) de uma data ISO — evita problemas de fuso/horário de verão. */
function dayNumber(date) {
    const [y, m, d] = date.split('-').map(Number);
    return Math.floor(Date.UTC(y, m - 1, d) / MS_DAY);
}
function addDays(date, n) {
    const [y, m, d] = date.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d + n));
    return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, '0')}-${String(dt.getUTCDate()).padStart(2, '0')}`;
}
/** Índice do dia dentro do desafio (0 = primeiro dia). */
function dayIndex(start, date) {
    return dayNumber(date) - dayNumber(start);
}
/** Semana do desafio (0-based): dias 0-6 = semana 0, etc. */
function weekIndex(start, date) {
    return Math.floor(dayIndex(start, date) / 7);
}
function formatBR(date) {
    const [y, m, d] = date.split('-');
    return `${d}/${m}/${y}`;
}
function weekdayShort(date) {
    const [y, m, d] = date.split('-').map(Number);
    return ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
}


const DEFAULT_RULES = {
    workoutsPerWeek: 4,
    workoutBonusAt: 5,
    cardioPerWeek: 3,
    cardioMinMinutes: 30,
    waterGoalMl: 3000,
    points: { workout: 10, workoutBonus: 5, cardio: 5, water: 5, noSweets: 5, noAlcohol: 5 },
};
/** Status do mínimo semanal de treino. */
function workoutStatus(count, rules) {
    if (count >= rules.workoutBonusAt)
        return 'bonus';
    if (count >= rules.workoutsPerWeek)
        return 'met';
    return 'below';
}
/** Pontos de treino de UMA semana: 10 por treino + bônus (uma vez) ao atingir o 5º. */
function weekWorkoutPoints(count, rules) {
    const bonus = count >= rules.workoutBonusAt ? rules.points.workoutBonus : 0;
    return count * rules.points.workout + bonus;
}
function groupWeeks(items, start) {
    const map = new Map();
    for (const it of items) {
        const w = weekIndex(start, it.date);
        if (w < 0)
            continue;
        if (!map.has(w))
            map.set(w, []);
        map.get(w).push(it);
    }
    return map;
}
function dayPoints(log, rules) {
    const water = log && log.waterMl >= rules.waterGoalMl ? rules.points.water : 0;
    const sweets = log?.noSweets === true ? rules.points.noSweets : 0;
    const alcohol = log?.noAlcohol === true ? rules.points.noAlcohol : 0;
    return { water, sweets, alcohol, total: water + sweets + alcohol };
}
/** Sequência atual e maior sequência de um campo booleano. Hoje sem registro não quebra a sequência. */
function streaks(days, field, today) {
    const map = new Map(days.map((d) => [d.date, d[field]]));
    const dates = [...map.keys()].sort();
    let best = 0;
    let run = 0;
    let prev = null;
    for (const d of dates) {
        if (map.get(d) === true) {
            run = prev && addDays(prev, 1) === d && run > 0 ? run + 1 : 1;
            prev = d;
            best = Math.max(best, run);
        }
        else {
            run = 0;
            prev = null;
        }
    }
    let current = 0;
    let cursor = today;
    if (map.get(cursor) === undefined || map.get(cursor) === null)
        cursor = addDays(cursor, -1);
    while (map.get(cursor) === true) {
        current++;
        cursor = addDays(cursor, -1);
    }
    return { current, best };
}
/** Dias seguidos com TUDO cumprido (água + doce + álcool). */
