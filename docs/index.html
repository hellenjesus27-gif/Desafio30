<div id="app"></div>
<script>
const MS_DAY = 86400000;
function toISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}
function todayISO(now = new Date()) {
    return toISO(now);
}
/** Número de dias (UTC) de uma data ISO — evita problemas de fuso/horário de verão. */
function dayNumber(date) {
    const [y, m, d] = date.split('-').map(Number);
    return Math.floor(Date.UTC(y, m - 1, d) / MS_DAY);
}
function addDays(date, n) {
    const [y, m, d] = date.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d + n));
    return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, '0')}-${String(dt.getUTCDate()).padStart(2, '0')}`;
}
/** Índice do dia dentro do desafio (0 = primeiro dia). */
function dayIndex(start, date) {
    return dayNumber(date) - dayNumber(start);
}
/** Semana do desafio (0-based): dias 0-6 = semana 0, etc. */
function weekIndex(start, date) {
    return Math.floor(dayIndex(start, date) / 7);
}
function formatBR(date) {
    const [y, m, d] = date.split('-');
    return `${d}/${m}/${y}`;
}
function weekdayShort(date) {
    const [y, m, d] = date.split('-').map(Number);
    return ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
}


const DEFAULT_RULES = {
    workoutsPerWeek: 4,
    workoutBonusAt: 5,
    cardioPerWeek: 3,
    cardioMinMinutes: 30,
    waterGoalMl: 3000,
    points: { workout: 10, workoutBonus: 5, cardio: 5, water: 5, noSweets: 5, noAlcohol: 5 },
};
/** Status do mínimo semanal de treino. */
function workoutStatus(count, rules) {
    if (count >= rules.workoutBonusAt)
        return 'bonus';
    if (count >= rules.workoutsPerWeek)
        return 'met';
    return 'below';
}
/** Pontos de treino de UMA semana: 10 por treino + bônus (uma vez) ao atingir o 5º. */
function weekWorkoutPoints(count, rules) {
    const bonus = count >= rules.workoutBonusAt ? rules.points.workoutBonus : 0;
    return count * rules.points.workout + bonus;
}
function groupWeeks(items, start) {
    const map = new Map();
    for (const it of items) {
        const w = weekIndex(start, it.date);
        if (w < 0)
            continue;
        if (!map.has(w))
            map.set(w, []);
        map.get(w).push(it);
    }
    return map;
}
function dayPoints(log, rules) {
    const water = log && log.waterMl >= rules.waterGoalMl ? rules.points.water : 0;
    const sweets = log?.noSweets === true ? rules.points.noSweets : 0;
    const alcohol = log?.noAlcohol === true ? rules.points.noAlcohol : 0;
    return { water, sweets, alcohol, total: water + sweets + alcohol };
}
/** Sequência atual e maior sequência de um campo booleano. Hoje sem registro não quebra a sequência. */
function streaks(days, field, today) {
    const map = new Map(days.map((d) => [d.date, d[field]]));
    const dates = [...map.keys()].sort();
    let best = 0;
    let run = 0;
    let prev = null;
    for (const d of dates) {
        if (map.get(d) === true) {
            run = prev && addDays(prev, 1) === d && run > 0 ? run + 1 : 1;
            prev = d;
            best = Math.max(best, run);
        }
        else {
            run = 0;
            prev = null;
        }
    }
    let current = 0;
    let cursor = today;
    if (map.get(cursor) === undefined || map.get(cursor) === null)
        cursor = addDays(cursor, -1);
    while (map.get(cursor) === true) {
        current++;
        cursor = addDays(cursor, -1);
    }
    return { current, best };
}
/** Dias seguidos com TUDO cumprido (água + doce + álcool). */
function perfectStreak(days, rules, today) {
    const ok = (d) => !!d && d.waterMl >= rules.waterGoalMl && d.noSweets === true && d.noAlcohol === true;
    const map = new Map(days.map((d) => [d.date, d]));
    let cursor = today;
    if (!map.has(cursor) || !ok(map.get(cursor))) {
        // hoje ainda pode estar incompleto: começa de ontem
        if (!ok(map.get(cursor)))
            cursor = addDays(cursor, -1);
    }
    let n = 0;
    while (ok(map.get(cursor))) {
        n++;
        cursor = addDays(cursor, -1);
    }
    return n;
}
function computeUserStats(userId, data, challenge, today) {
    const { rules, startDate } = challenge;
    const workouts = data.workouts.filter((w) => w.userId === userId);
    const cardios = data.cardios.filter((c) => c.userId === userId);
    const days = data.days.filter((d) => d.userId === userId);
    const wWeeks = groupWeeks(workouts, startDate);
    let workoutPoints = 0;
    wWeeks.forEach((list) => (workoutPoints += weekWorkoutPoints(list.length, rules)));
    const validCardios = cardios.filter((c) => c.minutes >= rules.cardioMinMinutes);
    const cardioPoints = validCardios.length * rules.points.cardio;
    let waterDays = 0, sweetsDays = 0, alcoholDays = 0, disciplinePoints = 0, waterPoints = 0;
    for (const d of days) {
        const p = dayPoints(d, rules);
        if (p.water)
            waterDays++;
        if (d.noSweets === true)
            sweetsDays++;
        if (d.noAlcohol === true)
            alcoholDays++;
        waterPoints += p.water;
        disciplinePoints += p.sweets + p.alcohol;
    }
    const currentWeek = weekIndex(startDate, today);
    const workoutsThisWeek = (wWeeks.get(currentWeek) ?? []).length;
    const cardioThisWeek = (groupWeeks(validCardios, startDate).get(currentWeek) ?? []).length;
    let weekPoints = weekWorkoutPoints(workoutsThisWeek, rules) + cardioThisWeek * rules.points.cardio;
    for (const d of days) {
        if (weekIndex(startDate, d.date) === currentWeek) {
            const p = dayPoints(d, rules);
            weekPoints += p.total;
        }
    }
    const todayWorkouts = workouts.filter((w) => w.date === today).length;
    const todayCardios = validCardios.filter((c) => c.date === today).length;
    const todayPoints = todayWorkouts * rules.points.workout +
        todayCardios * rules.points.cardio +
        dayPoints(days.find((d) => d.date === today), rules).total;
    const sw = streaks(days, 'noSweets', today);
    const al = streaks(days, 'noAlcohol', today);
    let failedWeeks = 0;
    for (let w = 0; w < currentWeek; w++) {
        if ((wWeeks.get(w) ?? []).length < rules.workoutsPerWeek)
            failedWeeks++;
    }
    return {
        userId,
        points: workoutPoints + cardioPoints + waterPoints + disciplinePoints,
        weekPoints,
        todayPoints,
        workoutsTotal: workouts.length,
        workoutPoints,
        cardioTotal: validCardios.length,
        cardioPoints,
        waterDays,
        waterPoints,
        sweetsDays,
        alcoholDays,
        disciplinePoints,
        sweetsStreak: sw.current,
        alcoholStreak: al.current,
        bestSweetsStreak: sw.best,
        bestAlcoholStreak: al.best,
        streak: perfectStreak(days, rules, today),
        workoutsThisWeek,
        cardioThisWeek,
        workoutStatus: workoutStatus(workoutsThisWeek, rules),
        cardioMet: cardioThisWeek >= rules.cardioPerWeek,
        failedWeeks,
    };
}
function sortKey(s, f) {
    switch (f) {
        case 'geral': return s.points;
        case 'semana': return s.weekPoints;
        case 'hoje': return s.todayPoints;
        case 'treinos': return s.workoutPoints;
        case 'cardio': return s.cardioPoints;
        case 'agua': return s.waterPoints;
        case 'disciplina': return s.disciplinePoints;
    }
}
/** Ranking ordenado (desempate: pontos gerais, depois nome). Posições empatadas compartilham o mesmo número. */
function buildRanking(stats, filter) {
    const sorted = [...stats].sort((a, b) => sortKey(b, filter) - sortKey(a, filter) || b.points - a.points || a.userId.localeCompare(b.userId));
    let pos = 0;
    let lastVal = null;
    return sorted.map((s, i) => {
        const value = sortKey(s, filter);
        if (value !== lastVal) {
            pos = i + 1;
            lastVal = value;
        }
        return { ...s, position: pos, value };
    });
}
/** Status geral de um dia para o calendário. */
function dayStatus(date, data, userId, rules) {
    const log = data.days.find((d) => d.userId === userId && d.date === date);
    const trained = data.workouts.some((w) => w.userId === userId && w.date === date);
    const cardio = data.cardios.some((c) => c.userId === userId && c.date === date && c.minutes >= rules.cardioMinMinutes);
    const water = !!log && log.waterMl >= rules.waterGoalMl;
    const sweets = log?.noSweets === true;
    const alcohol = log?.noAlcohol === true;
    // Treino/cardio são metas semanais: o dia fica "cheio" com os 3 hábitos diários.
    const daily = [water, sweets, alcohol].filter(Boolean).length;
    if (daily === 3)
        return 'full';
    if (daily > 0 || trained || cardio)
        return 'partial';
    return 'none';
}
function challengeDayNumber(c, today) {
    return Math.min(Math.max(dayIndex(c.startDate, today) + 1, 0), c.durationDays);
}


const ACHIEVEMENTS = [
    { id: 'first', emoji: '🏆', title: 'Primeiro treino', desc: 'Registre seu primeiro treino' },
    { id: 'streak7', emoji: '🔥', title: '7 dias seguidos', desc: '7 dias com todos os hábitos diários' },
    { id: 'water7', emoji: '💧', title: '7 dias de água', desc: 'Bata 3 L em 7 dias' },
    { id: 'sweets10', emoji: '🍫', title: '10 dias sem doce', desc: 'Sequência de 10 dias sem doce' },
    { id: 'alcohol10', emoji: '🍺', title: '10 dias sem álcool', desc: 'Sequência de 10 dias sem álcool' },
    { id: 'week5', emoji: '🏋️', title: '5 treinos na semana', desc: 'Faça 5 treinos em uma semana' },
    { id: 'w20', emoji: '💪', title: '20 treinos', desc: 'Acumule 20 treinos' },
    { id: 'leader', emoji: '👑', title: 'Líder do ranking', desc: 'Fique em 1º lugar' },
    { id: 'complete', emoji: '🎖️', title: 'Desafio completo', desc: 'Termine todos os dias do desafio' },
];
function unlockedAchievements(userId, stats, data, challenge, position, ended) {
    const out = [];
    const workouts = data.workouts.filter((w) => w.userId === userId);
    if (workouts.length >= 1)
        out.push('first');
    if (stats.streak >= 7)
        out.push('streak7');
    if (stats.waterDays >= 7)
        out.push('water7');
    if (stats.bestSweetsStreak >= 10)
        out.push('sweets10');
    if (stats.bestAlcoholStreak >= 10)
        out.push('alcohol10');
    // 5 treinos em qualquer semana
    const perWeek = new Map();
    for (const w of workouts) {
        const wk = weekIndex(challenge.startDate, w.date);
        perWeek.set(wk, (perWeek.get(wk) ?? 0) + 1);
    }
    if ([...perWeek.values()].some((n) => n >= challenge.rules.workoutBonusAt))
        out.push('week5');
    if (workouts.length >= 20)
        out.push('w20');
    if (position === 1 && stats.points > 0)
        out.push('leader');
    if (ended && stats.failedWeeks === 0)
        out.push('complete');
    return out;
}



/** Gerador pseudo-aleatório determinístico (dados de demonstração estáveis). */
function rng(seed) {
    let s = seed;
    return () => {
        s = (s * 1664525 + 1013904223) % 4294967296;
        return s / 4294967296;
    };
}
const DEMO_USER_ID = 'u-hellen';
function buildSeed(today) {
    const start = addDays(today, -11); // hoje = dia 12
    const users = [
        { id: DEMO_USER_ID, name: 'Hellen', email: 'demo@desafio30.app', isAdmin: true },
        { id: 'u-camila', name: 'Camila', email: 'camila@demo.app' },
        { id: 'u-giu', name: 'Giuli', email: 'giuli@demo.app' },
        { id: 'u-rafa', name: 'Rafa', email: 'rafa@demo.app' },
        { id: 'u-bia', name: 'Bia', email: 'bia@demo.app' },
    ];
    const challenge = {
        id: 'c1', groupId: 'g1', name: 'Desafio 30', startDate: start, durationDays: 30,
        status: 'active', rules: DEFAULT_RULES,
    };
    const group = {
        id: 'g1', name: 'Turma do Desafio', inviteCode: 'D30-TURMA', adminId: DEMO_USER_ID,
        memberIds: users.map((u) => u.id), challengeId: 'c1',
    };
    const workouts = [];
    const cardios = [];
    const days = [];
    const types = ['musculacao', 'funcional', 'corrida', 'pilates', 'crossfit'];
    // consistência por usuário (chance de cumprir cada hábito)
    const profile = {
        [DEMO_USER_ID]: { w: 0.62, c: 0.35, water: 0.75, s: 0.85, a: 0.9 },
        'u-camila': { w: 0.75, c: 0.45, water: 0.85, s: 0.9, a: 0.95 },
        'u-giu': { w: 0.55, c: 0.3, water: 0.7, s: 0.7, a: 0.85 },
        'u-rafa': { w: 0.45, c: 0.25, water: 0.5, s: 0.6, a: 0.5 },
        'u-bia': { w: 0.65, c: 0.4, water: 0.8, s: 0.8, a: 0.9 },
    };
    users.forEach((u, ui) => {
        const r = rng(101 + ui * 17);
        const p = profile[u.id];
        for (let i = 0; i <= 11; i++) {
            const date = addDays(start, i);
            const isToday = date === today;
            if (r() < p.w) {
                workouts.push({ id: `w-${u.id}-${i}`, userId: u.id, date, type: types[Math.floor(r() * types.length)], minutes: 45 + Math.floor(r() * 30) });
            }
            if (r() < p.c) {
                cardios.push({ id: `c-${u.id}-${i}`, userId: u.id, date, time: '07:00', type: 'caminhada', minutes: 30 + Math.floor(r() * 25) });
            }
            const water = r() < p.water ? 3000 + Math.floor(r() * 3) * 250 : 1500 + Math.floor(r() * 5) * 250;
            days.push({
                userId: u.id, date,
                waterMl: isToday ? (u.id === DEMO_USER_ID ? 2400 : Math.min(water, 2500)) : water,
                noSweets: isToday && u.id !== DEMO_USER_ID ? null : r() < p.s,
                noAlcohol: isToday && u.id !== DEMO_USER_ID ? null : r() < p.a,
            });
        }
    });
    // Hellen: hoje com doce/álcool cumpridos
    const hd = days.find((d) => d.userId === DEMO_USER_ID && d.date === today);
    if (hd) {
        hd.noSweets = true;
        hd.noAlcohol = true;
    }
    const now = new Date().toISOString();
    const activities = [
        { id: 'a1', userId: 'u-camila', text: 'Camila completou 5 treinos essa semana 🔥', createdAt: now, reactions: [{ userId: DEMO_USER_ID, emoji: '🔥' }], comments: [] },
        { id: 'a2', userId: 'u-bia', text: 'Bia bateu a meta de 3 L de água 💧', createdAt: now, reactions: [], comments: [] },
        { id: 'a3', userId: 'u-rafa', text: 'Rafa fez 40 min de corrida 🏃', createdAt: now, reactions: [], comments: [] },
    ];
    return { users, challenge, group, workouts, cardios, days, activities };
}

V.ranking = function () {
  var r = rules(), F = [['geral', 'Geral'], ['semana', 'Semana'], ['hoje', 'Hoje'], ['treinos', 'Treinos'], ['cardio', 'Cardio'], ['agua', 'Água'], ['disciplina', 'Disciplina']];
  var rank = buildRanking(allStats(), ui.filter), med = { 1: '🥇', 2: '🥈', 3: '🥉' };
  var mine = rank.filter(function (x) { return x.userId === ME; })[0];
  return '<h1>Ranking 🏆</h1><div class="chips">' + F.map(function (f) { return chip(f[1], ui.filter === f[0], 'filter:' + f[0]); }).join('') + '</div>' +
  '<div class="card rosebg"><b>VOCÊ — #' + mine.position + '</b><div class="big">' + mine.value + ' pontos</div></div>' +
  rank.map(function (x) {
    var me = x.userId === ME;
    return '<div class="card' + (me ? ' me' : '') + '"><div class="row"><span class="medal">' + (med[x.position] || x.position + 'º') + '</span><span class="av">' + userName(x.userId).charAt(0) + '</span><div class="grow"><b>' + userName(x.userId) + (me ? ' (você)' : '') + '</b><div class="muted sm">🔥 ' + x.streak + ' dias de sequência</div></div><div class="r"><div class="pts rose">' + x.value + '</div><div class="muted sm">pontos</div></div></div>' +
    '<div class="muted sm" style="margin-top:8px">🏋️ ' + x.workoutsTotal + ' · 🏃 ' + x.cardioTotal + ' · 💧 ' + x.waterDays + 'd · 🍫 ' + x.sweetsStreak + 'd · 🍺 ' + x.alcoholStreak + 'd</div>' +
    '<div class="pills">' + badge(x.workoutStatus, x.workoutsThisWeek, r) + '<span class="pill ' + (x.cardioMet ? 'ok' : 'bad') + '">' + (x.cardioMet ? '🟢' : '🔴') + ' Cardio ' + x.cardioThisWeek + '/' + r.cardioPerWeek + '</span>' + (x.failedWeeks ? '<span class="pill bad">⚠️ ' + x.failedWeeks + ' sem. sem mínimo</span>' : '') + '</div></div>';
  }).join('');
};

V.register = function () {
  var r = rules(), me = allStats().filter(function (s) { return s.userId === ME; })[0], log = myLog(TODAY), water = log ? log.waterMl : 0;
  var W = { musculacao: '🏋️ Musculação', funcional: '🤸 Funcional', crossfit: '🔱 Crossfit', pilates: '🧘 Pilates', corrida: '🏃 Corrida', natacao: '🏊 Natação', danca: '💃 Dança', esporte: '⚽ Esporte', outro: '✨ Outro' };
  var C = { caminhada: '🚶 Caminhada', corrida: '🏃 Corrida', bicicleta: '🚴 Bicicleta', escada: '🪜 Escada', transport: '🚋 Transport', eliptico: '🌀 Elíptico', outro: '✨ Outro' };
  var hab = function (field, streak, best, unit) {
    var v = log ? log[field] : null;
    return '<div class="card"><b>🔥 ' + streak + ' dias ' + unit + '</b><div class="muted sm">Maior sequência: ' + best + '</div><div class="two"><button class="big-btn' + (v === true ? ' okb' : '') + '" data-a="hab:' + field + ':1">✅ Cumpri</button><button class="big-btn' + (v === false ? ' badb' : '') + '" data-a="hab:' + field + ':0">❌ Não cumpri</button></div></div>';
  };
  return '<h1>Registrar</h1><p class="muted">Tudo em um só lugar · hoje</p>' +
  '<h2>🏋️ Treino</h2><div class="card"><div class="muted sm">Semana: ' + me.workoutsThisWeek + '/' + r.workoutsPerWeek + (me.workoutStatus === 'bonus' ? ' ⭐' : '') + '</div><div class="chips wrap">' +
  Object.keys(W).map(function (k) { return chip(W[k], ui.wType === k, 'wt:' + k); }).join('') + '</div><button class="btn" data-a="saveW">Registrar treino</button></div>' +
  '<h2>🏃 Cardio</h2><div class="card"><div class="muted sm">Semana: ' + me.cardioThisWeek + '/' + r.cardioPerWeek + ' (mín. ' + r.cardioMinMinutes + ' min)</div><div class="chips wrap">' +
  Object.keys(C).map(function (k) { return chip(C[k], ui.cType === k, 'ct:' + k); }).join('') + '</div>' +
  '<div class="two"><label>Duração (min)<input id="cmin" inputmode="numeric" value="' + ui.cMin + '"></label><label>Horário<input id="ctime" value="' + ui.cTime + '"></label></div><button class="btn" data-a="saveC">Registrar cardio</button></div>' +
  '<h2>💧 Água</h2><div class="card"><div class="big' + (water >= r.waterGoalMl ? ' okc' : '') + '">💧 ' + fmtL(water) + ' L / ' + fmtL(r.waterGoalMl) + ' L</div>' + (water >= r.waterGoalMl ? '<b class="okc">💧 META CONCLUÍDA!</b>' : '') +
  '<div class="chips wrap">' + [250, 500, 750, 1000].map(function (ml) { return chip(ml >= 1000 ? '+1 L' : '+' + ml + ' ml', false, 'w:' + ml); }).join('') + '</div><div class="chips">' + chip('↩︎ Desfazer 250 ml', false, 'w:-250') + chip('Zerar', false, 'w:0') + '</div></div>' +
  '<h2>🍫 Zero doce</h2>' + hab('noSweets', me.sweetsStreak, me.bestSweetsStreak, 'sem doce') +
  '<h2>🍺 Zero álcool</h2>' + hab('noAlcohol', me.alcoholStreak, me.bestAlcoholStreak, 'sem álcool');
};

V.calendar = function () {
  var r = rules(), c = db.challenge, cells = '';
  for (var i = 0; i < c.durationDays; i++) {
    var d = addDays(c.startDate, i), fut = d > TODAY, st = fut ? 'fut' : dayStatus(d, data(), ME, r);
    cells += '<button class="cell ' + st + (ui.day === d ? ' sel' : '') + '" data-a="day:' + d + '"><b>' + (i + 1) + '</b><small>' + weekdayShort(d) + '</small></button>';
  }
  var log = myLog(ui.day), ws = db.workouts.filter(function (w) { return w.userId === ME && w.date === ui.day; }), cs = db.cardios.filter(function (x) { return x.userId === ME && x.date === ui.day; });
  var p = dayPoints(log, r), total = ws.length * r.points.workout + cs.filter(function (x) { return x.minutes >= r.cardioMinMinutes; }).length * r.points.cardio + p.total;
  var t = function (v) { return v === true ? '✅ Cumpriu' : v === false ? '❌ Não cumpriu' : '— sem registro'; };
  return '<h1>Calendário 📅</h1><div class="muted sm">🟢 Tudo cumprido · 🟡 Parcial · 🔴 Não cumprido</div><div class="cal">' + cells + '</div>' +
  '<h2>' + formatBR(ui.day) + ' · Dia ' + (dayIndex(c.startDate, ui.day) + 1) + '</h2><div class="card"><p>🏋️ Treino: ' + (ws.length ? ws.length + 'x' : '—') + '</p><p>🏃 Cardio: ' + (cs.length ? cs.map(function (x) { return x.minutes + ' min'; }).join(', ') : '—') + '</p><p>💧 Água: ' + fmtL(log ? log.waterMl : 0) + ' L' + (log && log.waterMl >= r.waterGoalMl ? ' ✅' : '') + '</p><p>🍫 Doce: ' + t(log && log.noSweets) + '</p><p>🍺 Álcool: ' + t(log && log.noAlcohol) + '</p><b class="rose">⭐ ' + total + ' pontos no dia</b></div>';
};

V.profile = function () {
  var stats = allStats(), me = stats.filter(function (s) { return s.userId === ME; })[0], rank = buildRanking(stats, 'geral');
  var pos = rank.filter(function (x) { return x.userId === ME; })[0].position;
  var got = unlockedAchievements(ME, me, data(), db.challenge, pos, false);
  return '<div class="center"><span class="av xl">H</span><h1>Hellen</h1></div><div class="three"><div class="card c"><div class="v">#' + pos + '</div><div class="muted sm">Posição</div></div><div class="card c"><div class="v">' + me.points + '</div><div class="muted sm">Pontos</div></div><div class="card c"><div class="v">🔥 ' + me.streak + '</div><div class="muted sm">Sequência</div></div></div>' +
  '<div class="card"><p>🏋️ Treinos: <b>' + me.workoutsTotal + '</b></p><p>🏃 Cardios (≥30 min): <b>' + me.cardioTotal + '</b></p><p>💧 Dias de água: <b>' + me.waterDays + '</b></p><p>🍫 Dias sem doce: <b>' + me.sweetsDays + '</b> (maior seq. ' + me.bestSweetsStreak + ')</p><p>🍺 Dias sem álcool: <b>' + me.alcoholDays + '</b> (maior seq. ' + me.bestAlcoholStreak + ')</p></div>' +
  '<h2>Minhas conquistas 🏅</h2><div class="grid">' + ACHIEVEMENTS.map(function (a) { var on = got.indexOf(a.id) >= 0; return '<div class="card c' + (on ? '' : ' off') + '"><div class="ic">' + (on ? a.emoji : '🔒') + '</div><b>' + a.title + '</b><div class="muted sm">' + a.desc + '</div></div>'; }).join('') + '</div>' +
  '<h2>Aparência</h2><div class="chips">' + chip('📱 Automático', db.dark === null, 'theme:auto') + chip('☀️ Claro', db.dark === false, 'theme:light') + chip('🌙 Escuro', db.dark === true, 'theme:dark') + '</div>' +
  '<button class="btn ghost" data-a="reset">Reiniciar demonstração</button>';
};

var TABS = [['home', '🏠', 'Início'], ['ranking', '🏆', 'Ranking'], ['register', '➕', 'Registrar'], ['calendar', '📅', 'Calendário'], ['profile', '👤', 'Perfil']];
function render() {
  var root = document.documentElement;
  if (db.dark === null) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', db.dark ? 'dark' : 'light');
  var keepY = window.scrollY;
  $app.innerHTML = '<main>' + V[ui.tab]() + '</main><nav>' + TABS.map(function (t) { return '<button class="tab' + (ui.tab === t[0] ? ' on' : '') + (t[0] === 'register' ? ' plus' : '') + '" data-a="tab:' + t[0] + '"><span>' + t[1] + '</span><small>' + t[2] + '</small></button>'; }).join('') + '</nav>' + (ui.toast ? '<div class="toast">' + ui.toast + '</div>' : '');
  window.scrollTo(0, keepY);
}

document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-a]') : null; if (!el) return;
  var p = el.getAttribute('data-a').split(':'), a = p[0], r = rules();
  if (a === 'tab') { ui.tab = p[1]; window.scrollTo(0, 0); render(); }
  else if (a === 'filter') { ui.filter = p[1]; render(); }
  else if (a === 'day') { ui.day = p[1]; render(); }
  else if (a === 'wt') { ui.wType = p[1]; render(); }
  else if (a === 'ct') { keepInputs(); ui.cType = p[1]; render(); }
  else if (a === 'saveW') {
    db.workouts.push({ id: 'w' + Date.now(), userId: ME, date: TODAY, type: ui.wType }); var n = allStats().filter(function (s) { return s.userId === ME; })[0].workoutsThisWeek;
    if (n === r.workoutBonusAt) post('Hellen completou ' + n + ' treinos essa semana 🔥'); save(); say(n >= r.workoutBonusAt ? '⭐ Bônus! ' + n + ' treinos na semana' : 'Treino registrado ✅ ' + n + '/' + r.workoutsPerWeek);
  }
  else if (a === 'saveC') {
    keepInputs(); var m = parseInt(ui.cMin, 10); if (!m || m <= 0) { say('Informe a duração em minutos'); return; }
    db.cardios.push({ id: 'c' + Date.now(), userId: ME, date: TODAY, time: ui.cTime, type: ui.cType, minutes: m }); if (m >= r.cardioMinMinutes) post('Hellen fez ' + m + ' min de ' + ui.cType + ' 🏃');
    save(); say(m >= r.cardioMinMinutes ? 'Cardio registrado ✅ +' + r.points.cardio + ' pts' : 'Menos de ' + r.cardioMinMinutes + ' min não pontua');
  }
  else if (a === 'w') { var ml = parseInt(p[1], 10); upsertDay(TODAY, function (d) { d.waterMl = ml === 0 ? 0 : Math.max(0, d.waterMl + ml); }); }
  else if (a === 'hab') { upsertDay(TODAY, function (d) { d[p[1]] = p[2] === '1'; }); }
  else if (a === 'theme') { db.dark = p[1] === 'auto' ? null : p[1] === 'dark'; save(); render(); }
  else if (a === 'reset') { reset(); }
});
function keepInputs() { var a = document.getElementById('cmin'), b = document.getElementById('ctime'); if (a) ui.cMin = a.value; if (b) ui.cTime = b.value; }
document.addEventListener('DOMContentLoaded', function () { $app = document.getElementById('app'); render(); });
if (document.readyState !== 'loading') { $app = document.getElementById('app'); render(); }

</script>

</body>
</html>
